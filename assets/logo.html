<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1024px;
      height: 1024px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090D16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .canvas {
      width: 1024px;
      height: 1024px;
      position: relative;
      background: radial-gradient(circle at 50% 35%, #182642 0%, #0c1322 55%, #060911 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Subtle grid / radar lines */
    .grid-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(0, 242, 254, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
      background-size: 64px 64px;
    }
    .icon-container {
      position: relative;
      width: 720px;
      height: 720px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Outer subtle glow ring */
    .glow-ring {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.15) 0%, rgba(99, 102, 241, 0.05) 50%, transparent 70%);
      filter: blur(40px);
    }
    svg {
      width: 620px;
      height: 620px;
      filter: drop-shadow(0 20px 40px rgba(0, 242, 254, 0.25));
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="grid-bg"></div>
    <div class="glow-ring"></div>
    <div class="icon-container">
      <svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="primaryGrad" x1="50" y1="450" x2="450" y2="50" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0061FF" />
            <stop offset="50%" stop-color="#60EFFF" />
            <stop offset="100%" stop-color="#00FFA3" />
          </linearGradient>
          <linearGradient id="purpleGrad" x1="100" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#A855F7" />
            <stop offset="100%" stop-color="#3B82F6" />
          </linearGradient>
          <linearGradient id="glassGrad" x1="0" y1="0" x2="500" y2="500" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="rgba(255, 255, 255, 0.15)" />
            <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
          </linearGradient>
          <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <!-- Outer Decorative Orbit Circle -->
        <circle cx="230" cy="230" r="170" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3" stroke-dasharray="10 12" />
        <circle cx="230" cy="230" r="130" stroke="rgba(96, 239, 255, 0.18)" stroke-width="2" />

        <!-- Stylized Search Loop (Main Body) -->
        <circle cx="225" cy="225" r="120" stroke="url(#primaryGrad)" stroke-width="26" stroke-linecap="round" filter="url(#neonGlow)" />
        
        <!-- Search Handle morphed into Ray / Trajectory -->
        <path d="M315 315 L435 435" stroke="url(#primaryGrad)" stroke-width="28" stroke-linecap="round" filter="url(#neonGlow)" />

        <!-- Trending Exponential Growth Chart inside the Search Lens -->
        <!-- Step 1: Bars / Data nodes -->
        <rect x="155" y="250" width="16" height="50" rx="8" fill="rgba(255, 255, 255, 0.25)" />
        <rect x="185" y="220" width="16" height="80" rx="8" fill="rgba(255, 255, 255, 0.4)" />
        <rect x="215" y="180" width="16" height="120" rx="8" fill="url(#primaryGrad)" />
        <rect x="245" y="145" width="16" height="155" rx="8" fill="url(#primaryGrad)" />
        <rect x="275" y="115" width="16" height="185" rx="8" fill="#00FFA3" />

        <!-- Dynamic Laser Arrow Cutting Through (SEO Rank #1 Surge) -->
        <path d="M140 260 C170 240, 200 210, 240 160 L320 85" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
        
        <!-- Arrowhead at Top Right -->
        <path d="M295 85 L325 82 L320 112" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

        <!-- Glowing Sparkles / Intelligence Nodes -->
        <circle cx="325" cy="82" r="10" fill="#00FFA3" filter="url(#neonGlow)" />
        <circle cx="240" cy="160" r="6" fill="#60EFFF" />
        <circle cx="140" cy="260" r="5" fill="#0061FF" />
        
        <!-- Mini AI Core Particle -->
        <circle cx="105" cy="130" r="6" fill="#A855F7" />
        <circle cx="380" cy="200" r="8" fill="#60EFFF" />
      </svg>
    </div>
  </div>
</body>
</html>
